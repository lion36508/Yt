name: Pull Request Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# No repository permissions, secrets, checkout, or execution of PR code.
permissions: {}

concurrency:
  group: pull-request-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-policy:
    name: Confirm human review policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate event metadata and publish policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .pull_request != null
            and (.pull_request.number | type == "number")
            and (.pull_request.user.login | type == "string" and length > 0)
          ' "$GITHUB_EVENT_PATH" >/dev/null

          {
            printf '%s\n' '## Pull request policy'
            printf '%s\n' ''
            printf '%s\n' '- No comments or personal messages are sent by automation.'
            printf '%s\n' '- No reviewer requests, approvals, or automatic merges are performed.'
            printf '%s\n' '- An authorized maintainer must review and merge changes manually.'
            printf '%s\n' ''
            printf '%s\n' 'This workflow is a policy notice, not a security certification.'
          } >> "$GITHUB_STEP_SUMMARY"
