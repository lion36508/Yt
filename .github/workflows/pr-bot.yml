name: NEXORA Smart PR Bot

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review-and-greet:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Scan PR and Auto-Reply
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = context.issue.number;
            const repoName = context.repo.repo;
            const ownerName = context.repo.owner;
            const author = context.payload.pull_request.user.login;

            // 1. डेवलपर के भेजे गए कोड (Files) को स्कैन करने के लिए निकालें
            const files = await github.rest.pulls.listFiles({
              owner: ownerName,
              repo: repoName,
              pull_number: prNumber
            });

            let isSuspicious = false;
            // इन खतरनाक शब्दों को स्कैन करेगा
            const badKeywords = ['rm -rf', 'eval(', 'exec(', 'Runtime.getRuntime()', 'base64_decode', 'system('];

            for (const file of files.data) {
              if (file.patch) {
                for (const word of badKeywords) {
                  if (file.patch.includes(word)) {
                    isSuspicious = true;
                    break;
                  }
                }
              }
            }

            // 2. अगर कोड में डाउट है (तो डिलीट नहीं करेगा, बस ह्यूमन रिव्यू के लिए भेजेगा)
            if (isSuspicious) {
              await github.rest.issues.createComment({
                owner: ownerName,
                repo: repoName,
                issue_number: prNumber,
                body: `👋 Hi @${author}! NEXORA प्रोजेक्ट में योगदान (Contribution) देने के लिए बहुत-बहुत धन्यवाद! ❤️\n\n🤖 **Bot Message:** हमारे सिस्टम ने आपके कोड को स्कैन किया है। हम इसे रिजेक्ट या डिलीट नहीं कर रहे हैं, बल्कि हमने इसे **Human Review (इंसानी जांच)** के लिए भेज दिया है। हमारे डेवलपर्स इसे जल्द ही चेक करेंगे। आपकी मदद के लिए धन्यवाद!`
              });
              await github.rest.issues.addLabels({
                owner: ownerName,
                repo: repoName,
                issue_number: prNumber,
                labels: ['Needs Human Review', 'Pending']
              });
            } 
            // 3. अगर कोड 100% सेफ है, तो ऑटोमैटिकली एक्सेप्ट कर लेगा
            else {
              await github.rest.issues.createComment({
                owner: ownerName,
                repo: repoName,
                issue_number: prNumber,
                body: `👋 Hi @${author}! NEXORA प्रोजेक्ट में मदद के लिए बहुत-बहुत धन्यवाद! ❤️\n\n🤖 **Bot Message:** आपका कोड बिल्कुल सुरक्षित और शानदार लग रहा है। सिस्टम ने इसे पास कर दिया है और हम इसे ऑटोमैटिकली एक्सेप्ट (Merge) कर रहे हैं! 🚀`
              });
              try {
                await github.rest.pulls.merge({
                  owner: ownerName,
                  repo: repoName,
                  pull_number: prNumber,
                  merge_method: 'merge'
                });
              } catch (e) {
                console.log("Merge conflict, leaving for human review.");
              }
            }
