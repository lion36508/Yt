name: NEXORA PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  human-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request human review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("This workflow only supports pull_request events.");
              return;
            }

            // Never execute or check out contributor code in this workflow.
            // Automated keyword scans cannot prove code is safe; merging
            // remains an explicit maintainer decision.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: "Thanks for contributing to NEXORA. Automated checks cannot prove code is safe. This pull request is queued for human review; the bot will not approve or merge it."
            });
