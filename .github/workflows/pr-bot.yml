name: NEXORA PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  human-review:
    runs-on: ubuntu-latest
    steps:
      - name: Mark pull request for human review
        run: |
          echo "::notice title=Human review required::Automated keyword scans cannot prove code is safe. This workflow never approves or merges pull requests."
